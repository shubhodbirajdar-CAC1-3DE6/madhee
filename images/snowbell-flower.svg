<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="120" height="80">
  <defs>
    <filter id="cat-shadow3" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  <g filter="url(#cat-shadow3)">
    <!-- Ears -->
    <path d="M 28 35 L 20 8 L 44 24 Z" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <path d="M 28 30 L 23 12 L 40 24 Z" fill="#fbcfe8"/>
    <path d="M 92 35 L 100 8 L 76 24 Z" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <path d="M 92 30 L 97 12 L 80 24 Z" fill="#fbcfe8"/>

    <!-- Flower behind right ear -->
    <circle cx="86" cy="18" r="5" fill="#f472b6"/>
    <circle cx="80" cy="16" r="4.5" fill="#fb7185"/>
    <circle cx="92" cy="16" r="4.5" fill="#fb7185"/>
    <circle cx="83" cy="22" r="4.5" fill="#fda4af"/>
    <circle cx="89" cy="22" r="4.5" fill="#fda4af"/>
    <circle cx="86" cy="18" r="3" fill="#fde047"/>

    <!-- Fluffy Head -->
    <ellipse cx="60" cy="40" rx="38" ry="28" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Happy Eyes (Winking / Sparkle) -->
    <path d="M 40 38 Q 45 32 50 38" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round"/>
    <ellipse cx="74" cy="38" rx="6" ry="7.5" fill="#38bdf8"/>
    <ellipse cx="74" cy="38" rx="4" ry="6.5" fill="#0284c7"/>
    <circle cx="72.5" cy="35.5" r="2.2" fill="#ffffff"/>
    <circle cx="76" cy="40" r="1.2" fill="#ffffff"/>

    <!-- Pink Nose -->
    <polygon points="57,45 63,45 60,49" fill="#f472b6"/>

    <!-- Mouth -->
    <path d="M 56 50 Q 60 53 60 49 Q 60 53 64 50" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="42" y1="46" x2="16" y2="43" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="42" y1="48" x2="14" y2="49" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="78" y1="46" x2="104" y2="43" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="78" y1="48" x2="106" y2="49" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Blush -->
    <circle cx="36" cy="46" r="4.5" fill="rgba(244, 114, 182, 0.4)"/>
    <circle cx="84" cy="46" r="4.5" fill="rgba(244, 114, 182, 0.4)"/>

    <!-- Paws Over Edge -->
    <ellipse cx="40" cy="65" rx="8" ry="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M 37 68 L 37 72 M 43 68 L 43 72" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="40" cy="66" rx="4.5" ry="3.5" fill="#fbcfe8"/>

    <ellipse cx="80" cy="65" rx="8" ry="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M 77 68 L 77 72 M 83 68 L 83 72" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="80" cy="66" rx="4.5" ry="3.5" fill="#fbcfe8"/>
  </g>
