<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 85" width="120" height="85">
  <defs>
    <filter id="cat-shadow4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>
  <g filter="url(#cat-shadow4)">
    <!-- Tail wagging on top -->
    <path d="M 30 38 C 18 26, 20 10, 32 6 C 38 4, 40 14, 34 22" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <path d="M 30 38 C 18 26, 20 10, 32 6 C 38 4, 40 14, 34 22" fill="none" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Ears -->
    <path d="M 38 32 L 32 8 L 52 22 Z" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <path d="M 38 28 L 34 12 L 48 22 Z" fill="#fbcfe8"/>
    <path d="M 92 32 L 100 8 L 78 22 Z" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>
    <path d="M 92 28 L 97 12 L 82 22 Z" fill="#fbcfe8"/>

    <!-- Head tilted slightly cute -->
    <ellipse cx="65" cy="38" rx="36" ry="26" fill="#ffffff" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Big Curious Eyes -->
    <ellipse cx="52" cy="36" rx="6" ry="7.5" fill="#38bdf8"/>
    <ellipse cx="52" cy="36" rx="4" ry="6.5" fill="#0284c7"/>
    <circle cx="50.5" cy="33.5" r="2.2" fill="#ffffff"/>
    <circle cx="54" cy="38" r="1.2" fill="#ffffff"/>

    <ellipse cx="78" cy="36" rx="6" ry="7.5" fill="#38bdf8"/>
    <ellipse cx="78" cy="36" rx="4" ry="6.5" fill="#0284c7"/>
    <circle cx="76.5" cy="33.5" r="2.2" fill="#ffffff"/>
    <circle cx="80" cy="38" r="1.2" fill="#ffffff"/>

    <!-- Pink Nose -->
    <polygon points="62,43 68,43 65,47" fill="#f472b6"/>

    <!-- Open Happy Mouth -->
    <path d="M 62 48 Q 65 52 68 48" fill="#f472b6" stroke="#475569" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Whiskers -->
    <line x1="48" y1="44" x2="22" y2="42" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="48" y1="46" x2="20" y2="48" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="82" y1="44" x2="108" y2="42" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="82" y1="46" x2="110" y2="48" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>

    <!-- Blush -->
    <circle cx="43" cy="44" r="4" fill="rgba(244, 114, 182, 0.4)"/>
    <circle cx="87" cy="44" r="4" fill="rgba(244, 114, 182, 0.4)"/>

    <!-- Left Paw (resting on frame) -->
    <ellipse cx="48" cy="62" rx="7" ry="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <ellipse cx="48" cy="63" rx="4" ry="3" fill="#fbcfe8"/>

    <!-- Right Paw (Reaching playfully downward) -->
    <ellipse cx="86" cy="74" rx="8" ry="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
    <path d="M 83 78 L 83 82 M 89 78 L 89 82" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
    <ellipse cx="86" cy="75" rx="5" ry="4" fill="#fbcfe8"/>
  </g>
</svg>